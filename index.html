<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Notepad</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg-dark: #131314;
      --sidebar-bg: #1e1f20;
      --sidebar-hover: #282a2c;
      --sidebar-active: #37393b;
      --text-main: #e3e3e3;
      --text-muted: #8e918f;
      --accent: #a8c7fa;
      --border-color: #2c2e30;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      overflow: hidden;
      position: relative;
    }

    /* Password Modal Overlay */
    .password-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(19, 19, 20, 0.95);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-card {
      background: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      padding: 32px;
      border-radius: 20px;
      width: 320px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }

    .password-card h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .password-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .password-card input[type="password"] {
      width: 100%;
      padding: 12px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .password-card input[type="password"]:focus {
      border-color: var(--accent);
    }

    .password-card button {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #131314;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .password-card button:hover {
      opacity: 0.9;
    }

    .passcode-error {
      color: #ff6b6b;
      font-size: 12px;
      margin-top: 12px;
      display: none;
    }

    /* Sidebar Styling */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      user-select: none;
      z-index: 100;
      box-shadow: 6px 0 24px rgba(0, 0, 0, 0.4);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      transition: transform 0.3s ease;
    }

    /* Sidebar Resize Handle */
    .sidebar-resizer {
      position: absolute;
      top: 0;
      right: -4px;
      width: 8px;
      height: 100%;
      cursor: col-resize;
      z-index: 101;
      user-select: none;
      touch-action: none;
    }

    .sidebar-resizer:hover,
    .sidebar-resizer.resizing {
      background: rgba(168, 199, 250, 0.3);
    }

    body.is-resizing {
      cursor: col-resize !important;
      user-select: none !important;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    .new-note-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #2b2c2e;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 12px 18px;
      border-radius: 28px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      margin-bottom: 20px;
    }

    .new-note-btn:hover {
      background-color: var(--sidebar-hover);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .new-note-btn:active {
      transform: scale(0.98);
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }

    .note-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 14px;
      transition: background 0.2s ease, color 0.15s ease, transform 0.25s ease, opacity 0.25s ease, max-height 0.25s ease, margin 0.25s ease, padding 0.25s ease;
      max-height: 48px;
      opacity: 1;
      overflow: hidden;
      position: relative;
    }

    .note-item.newly-added {
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .note-item.deleting {
      opacity: 0;
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-top: 0;
      margin-bottom: 0;
      transform: scale(0.9);
      pointer-events: none;
    }

    .note-item.dragging {
      opacity: 0.3;
      background-color: var(--sidebar-hover);
    }

    .note-item:hover {
      background-color: var(--sidebar-hover);
      color: var(--text-main);
    }

    .note-item.active {
      background-color: var(--sidebar-active);
      color: var(--text-main);
      font-weight: 500;
    }

    .note-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      pointer-events: none;
    }

    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
      font-size: 16px;
      padding: 4px 6px;
      user-select: none;
      opacity: 0.6;
      transition: opacity 0.15s ease, color 0.15s ease;
      touch-action: none;
    }
    
    .drag-handle:hover {
      opacity: 1;
    }
    
    .drag-handle:active {
      cursor: grabbing;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 50%;
      opacity: 0.6;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .note-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      color: #ff6b6b;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.95);
        max-height: 0;
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        max-height: 48px;
      }
    }

    /* Main Editor Area */
    .main-content {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 28px 48px;
      background-color: var(--bg-dark);
      overflow: hidden;
    }

    .menu-toggle-btn {
      display: none;
      background: rgba(30, 31, 32, 0.85);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      z-index: 10;
      margin-right: 12px;
      backdrop-filter: blur(8px);
    }

    /* Wallpaper Layers */
    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.4s ease, filter 0.1s linear;
      background-position: center;
      background-size: cover;
    }

    .main-content.bg-active .bg-overlay {
      opacity: 1;
    }

    .bg-dimmer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(19, 19, 20, 0.4);
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .main-content.bg-active .bg-dimmer {
      opacity: 1;
    }

    .editor-header, .editor-textarea {
      position: relative;
      z-index: 3;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .editor-header-left {
      display: flex;
      align-items: center;
      flex: 1;
    }

    .title-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 24px;
      font-weight: 600;
      width: 100%;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .save-status {
      font-size: 12px;
      color: var(--text-muted);
      transition: opacity 0.3s ease;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      white-space: nowrap;
      margin-left: 12px;
    }

    .editor-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 16px;
      line-height: 1.6;
      resize: none;
      font-family: inherit;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    /* Controls Bar */
    .controls-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(30, 31, 32, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 12px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #37393b;
      transition: 0.3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: var(--text-muted);
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
      background-color: #131314;
    }

    .gear-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 50%;
      transition: color 0.2s, transform 0.3s;
    }

    .gear-btn:hover {
      color: var(--text-main);
      transform: rotate(45deg);
    }

    .popover {
      position: absolute;
      bottom: 60px;
      right: 20px;
      z-index: 20;
      background: #1e1f20;
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 300px;
      max-width: calc(100vw - 40px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.95);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .popover.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .popover-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .popover label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .slider-val {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
    }

    .popover input[type="text"] {
      background: #131314;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .popover input[type="text"]:focus {
      border-color: var(--accent);
    }

    .popover input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #2b2c2e;
      border-radius: 3px;
      outline: none;
    }

    .popover input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .popover input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }

    .popover-btn {
      background: var(--accent);
      color: #131314;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 4px;
    }

    .popover-btn:hover {
      opacity: 0.9;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #37393b;
      border-radius: 3px;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .menu-toggle-btn {
        display: block;
      }

      .main-content {
        padding: 16px 20px;
      }

      .title-input {
        font-size: 20px;
      }

      .controls-container {
        bottom: 16px;
        right: 16px;
        padding: 8px 14px;
      }

      .delete-btn {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <!-- Passcode Overlay -->
  <div class="password-modal-overlay" id="passwordModal">
    <div class="password-card">
      <h2>Protected Notepad</h2>
      <p>Enter passcode to unlock</p>
      <input type="password" id="passcodeInput" placeholder="Passcode" autocomplete="off">
      <button id="submitPasscodeBtn">Unlock</button>
      <div id="passcodeError" class="passcode-error">Incorrect passcode</div>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-resizer" id="sidebarResizer"></div>
    <button class="new-note-btn" id="newNoteBtn">
      <span>+</span> New note
    </button>
    <div class="notes-list" id="notesList"></div>
  </aside>

  <main class="main-content" id="mainContent">
    <video class="bg-overlay" id="bgVideo" autoplay loop muted playsinline style="display: none;"></video>
    <div class="bg-overlay" id="bgImage" style="display: none;"></div>
    <div class="bg-dimmer"></div>

    <div class="editor-header">
      <div class="editor-header-left">
        <button class="menu-toggle-btn" id="menuToggleBtn">☰</button>
        <input type="text" id="noteTitle" class="title-input" placeholder="Untitled Note">
      </div>
      <span id="saveStatus" class="save-status">Saved</span>
    </div>
    <textarea id="noteContent" class="editor-textarea" placeholder="Start typing..."></textarea>

    <div class="controls-container">
      <label class="switch">
        <input type="checkbox" id="bgToggle">
        <span class="slider"></span>
      </label>
      <button class="gear-btn" id="gearBtn" title="Change Background Settings">⚙</button>
    </div>

    <div class="popover" id="popover">
      <div class="popover-group">
        <label for="bgUrlInput">Wallpaper Link (Image / GIF / Video)</label>
        <input type="text" id="bgUrlInput" placeholder="https://...">
      </div>

      <div class="popover-group">
        <div class="popover-header">
          <label for="blurSlider">Blur</label>
          <span class="slider-val" id="blurVal">0px</span>
        </div>
        <input type="range" id="blurSlider" min="0" max="20" value="0" step="1">
      </div>

      <div class="popover-group">
        <div class="popover-header">
          <label for="brightnessSlider">Brightness</label>
          <span class="slider-val" id="brightnessVal">100%</span>
        </div>
        <input type="range" id="brightnessSlider" min="0" max="100" value="100" step="5">
      </div>

      <button class="popover-btn" id="saveBgBtn">Apply</button>
    </div>
  </main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // --- YOUR FIREBASE CONFIGURATION ---
  const firebaseConfig = {
    apiKey: "AIzaSyAuOOkhkfMMjDY2Sb_3NnFKVgUZsSrDECg",
    authDomain: "personal-notepad-7ca8f.firebaseapp.com",
    databaseURL: "https://personal-notepad-7ca8f-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "personal-notepad-7ca8f",
    storageBucket: "personal-notepad-7ca8f.firebasestorage.app",
    messagingSenderId: "174826675668",
    appId: "1:174826675668:web:bc9dfa66843d097b0b8a41"
  };

  let db = null;
  try {
    if (firebaseConfig.apiKey !== "YOUR_API_KEY" && firebaseConfig.databaseURL.indexOf("YOUR_PROJECT_ID") === -1) {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    }
  } catch (e) {
    console.warn("Firebase failed to initialize. Operating in offline/local mode.", e);
  }

  const DEFAULT_BG_URL = 'https://motionbgs.com/media/4553/miku-nakano.960x540.mp4';

  // App State
  let notes = JSON.parse(localStorage.getItem('notepad_notes')) || [];
  let activeNoteId = localStorage.getItem('notepad_active_id') || null;
  let bgEnabled = JSON.parse(localStorage.getItem('notepad_bg_enabled') ?? 'true');
  let bgUrl = localStorage.getItem('notepad_bg_url') || DEFAULT_BG_URL;
  let bgBlur = localStorage.getItem('notepad_bg_blur') || '0';
  let bgBrightness = localStorage.getItem('notepad_bg_brightness') || '100';
  let saveTimeout = null;
  let isRemoteUpdate = false;

  // DOM Elements
  const passwordModal = document.getElementById('passwordModal');
  const passcodeInputs = document.getElementById('passcodeInput');
  const submitPasscodeBtn = document.getElementById('submitPasscodeBtn');
  const passcodeError = document.getElementById('passcodeError');

  const notesListEl = document.getElementById('notesList');
  const newNoteBtn = document.getElementById('newNoteBtn');
  const noteTitleEl = document.getElementById('noteTitle');
  const noteContentEl = document.getElementById('noteContent');
  const saveStatusEl = document.getElementById('saveStatus');
  const mainContent = document.getElementById('mainContent');
  const bgVideo = document.getElementById('bgVideo');
  const bgImage = document.getElementById('bgImage');
  const bgToggle = document.getElementById('bgToggle');
  const gearBtn = document.getElementById('gearBtn');
  const popover = document.getElementById('popover');
  const bgUrlInput = document.getElementById('bgUrlInput');
  const blurSlider = document.getElementById('blurSlider');
  const blurVal = document.getElementById('blurVal');
  const brightnessSlider = document.getElementById('brightnessSlider');
  const brightnessVal = document.getElementById('brightnessVal');
  const saveBgBtn = document.getElementById('saveBgBtn');

  const sidebar = document.getElementById('sidebar');
  const menuToggleBtn = document.getElementById('menuToggleBtn');
  const sidebarOverlay = document.getElementById('sidebarOverlay');

  // SHA-256 Hashing helper
  async function hashPassword(str) {
    const utf8 = new TextEncoder().encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // --- Authentication Flow ---
  async function checkAuth() {
    const isAuth = localStorage.getItem('notepad_authenticated');
    if (isAuth === 'true') {
      passwordModal.style.display = 'none';
      bootApp();
      return;
    }

    async function verify() {
      const typed = passcodeInputs.value.trim();
      if (!typed) return;
      const hashed = await hashPassword(typed);

      if (db) {
        try {
          const snapshot = await get(child(ref(db), 'app_config/passcode_hash'));
          if (snapshot.exists() && snapshot.val() === hashed) {
            unlockApp();
            return;
          }
        } catch (err) {
          console.warn("Firebase Auth check failed, attempting local authentication check...", err);
        }
      }

      // Local fallback unlock if database isn't configured or reachable
      const storedLocalHash = localStorage.getItem('notepad_local_passcode_hash');
      if (storedLocalHash) {
        if (storedLocalHash === hashed) {
          unlockApp();
        } else {
          showAuthError("Incorrect passcode");
        }
      } else {
        // First login fallback
        localStorage.setItem('notepad_local_passcode_hash', hashed);
        unlockApp();
      }
    }

    function unlockApp() {
      localStorage.setItem('notepad_authenticated', 'true');
      passwordModal.style.display = 'none';
      bootApp();
    }

    function showAuthError(msg) {
      passcodeError.textContent = msg;
      passcodeError.style.display = 'block';
      passcodeInputs.value = '';
    }

    submitPasscodeBtn.addEventListener('click', verify);
    passcodeInputs.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') verify();
    });
  }

  function bootApp() {
    setupMobileEvents();
    setupDragAndDrop();
    setupSidebarResize();
    initBackgroundControls();

    if (db) {
      setupCloudSync();
    } else {
      initLocalData();
    }
  }

  function initLocalData() {
    if (notes.length === 0) {
      createNewNote(false);
    } else {
      if (!activeNoteId || !notes.find(n => n.id === activeNoteId)) {
        activeNoteId = notes[0].id;
      }
      renderSidebarFull();
      loadActiveNote();
    }
  }

  function setupCloudSync() {
    const dataRef = ref(db, 'notepad_data');
    onValue(dataRef, (snapshot) => {
      const data = snapshot.val();
      if (data && typeof data === 'object') {
        isRemoteUpdate = true;
        if (Array.isArray(data.notes)) notes = data.notes;
        if (data.activeNoteId) activeNoteId = data.activeNoteId;
        if (data.bgEnabled !== undefined) bgEnabled = data.bgEnabled;
        if (data.bgUrl) bgUrl = data.bgUrl;
        if (data.bgBlur) bgBlur = data.bgBlur;
        if (data.bgBrightness) bgBrightness = data.bgBrightness;

        renderSidebarFull();
        loadActiveNote();
        updateBackgroundUI();
        applyBackground();
        isRemoteUpdate = false;
      } else {
        initLocalData();
        saveToStorage();
      }
    }, (error) => {
      console.warn("Firebase Read Error (falling back to Local Storage):", error);
      initLocalData();
    });
  }

  function updateBackgroundUI() {
    bgToggle.checked = bgEnabled;
    bgUrlInput.value = bgUrl;
    blurSlider.value = bgBlur;
    blurVal.textContent = `${bgBlur}px`;
    
    bgBrightness = Math.min(Number(bgBrightness), 100).toString();
    brightnessSlider.value = bgBrightness;
    brightnessVal.textContent = `${bgBrightness}%`;
  }

  function setupMobileEvents() {
    menuToggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('active');
    });

    sidebarOverlay.addEventListener('click', closeMobileSidebar);
  }

  function closeMobileSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('active');
  }

  function setupSidebarResize() {
    const resizer = document.getElementById('sidebarResizer');
    if (!resizer) return;
    let isResizing = false;

    const savedWidth = localStorage.getItem('notepad_sidebar_width');
    if (savedWidth && window.innerWidth > 768) {
      sidebar.style.width = `${savedWidth}px`;
    }

    const startResize = () => {
      if (window.innerWidth <= 768) return;
      isResizing = true;
      resizer.classList.add('resizing');
      document.body.classList.add('is-resizing');
    };

    const handleResize = (clientX) => {
      if (!isResizing) return;

      const minWidth = 260;
      const maxWidth = window.innerWidth / 2;
      let newWidth = clientX;

      if (newWidth < minWidth) newWidth = minWidth;
      if (newWidth > maxWidth) newWidth = maxWidth;

      sidebar.style.width = `${newWidth}px`;
      localStorage.setItem('notepad_sidebar_width', newWidth);
    };

    const stopResize = () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('resizing');
        document.body.classList.remove('is-resizing');
      }
    };

    resizer.addEventListener('mousedown', startResize);
    document.addEventListener('mousemove', (e) => handleResize(e.clientX));
    document.addEventListener('mouseup', stopResize);

    resizer.addEventListener('touchstart', (e) => startResize(e.touches[0]), { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (isResizing) handleResize(e.touches[0].clientX);
    });
    document.addEventListener('touchend', stopResize);
  }

  function initBackgroundControls() {
    updateBackgroundUI();
    applyBackground();

    bgToggle.addEventListener('change', (e) => {
      bgEnabled = e.target.checked;
      saveToStorage();
      applyBackground();
    });

    gearBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      popover.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!popover.contains(e.target) && e.target !== gearBtn) {
        popover.classList.remove('active');
      }
    });

    blurSlider.addEventListener('input', (e) => {
      bgBlur = e.target.value;
      blurVal.textContent = `${bgBlur}px`;
      applyFilterStyles();
    });

    blurSlider.addEventListener('change', () => saveToStorage());

    brightnessSlider.addEventListener('input', (e) => {
      bgBrightness = e.target.value;
      brightnessVal.textContent = `${bgBrightness}%`;
      applyFilterStyles();
    });

    brightnessSlider.addEventListener('change', () => saveToStorage());

    saveBgBtn.addEventListener('click', () => {
      const val = bgUrlInput.value.trim();
      if (val) {
        bgUrl = val;
        saveToStorage();
        applyBackground();
        popover.classList.remove('active');
      }
    });
  }

  function isVideoUrl(url) {
    return url.match(/\.(mp4|webm|ogg)$/i) || url.includes('.mp4');
  }

  function applyFilterStyles() {
    const filterValue = `blur(${bgBlur}px) brightness(${bgBrightness}%)`;
    bgVideo.style.filter = filterValue;
    bgImage.style.filter = filterValue;
  }

  function applyBackground() {
    applyFilterStyles();
    if (bgEnabled) {
      mainContent.classList.add('bg-active');
      if (isVideoUrl(bgUrl)) {
        bgImage.style.display = 'none';
        bgVideo.style.display = 'block';
        if (bgVideo.src !== bgUrl) {
          bgVideo.src = bgUrl;
          bgVideo.play().catch(() => {});
        }
      } else {
        bgVideo.style.display = 'none';
        bgImage.style.display = 'block';
        bgImage.style.backgroundImage = `url('${bgUrl}')`;
      }
    } else {
      mainContent.classList.remove('bg-active');
    }
  }

  function createNoteElement(note, animate = false) {
    const item = document.createElement('div');
    item.className = `note-item ${note.id === activeNoteId ? 'active' : ''} ${animate ? 'newly-added' : ''}`;
    item.dataset.id = note.id;

    const titleSpan = document.createElement('span');
    titleSpan.className = 'note-item-title';
    titleSpan.textContent = note.title.trim() || 'Untitled Note';

    const handleBtn = document.createElement('span');
    handleBtn.className = 'drag-handle';
    handleBtn.innerHTML = '&#61;';
    handleBtn.title = 'Drag to reorder';

    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.innerHTML = '&times;';
    delBtn.title = 'Delete note';

    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteNoteWithAnimation(item, note.id);
    });

    item.appendChild(titleSpan);
    item.appendChild(handleBtn);
    item.appendChild(delBtn);

    item.addEventListener('click', () => {
      if (activeNoteId !== note.id) {
        switchActiveNote(note.id);
      }
      closeMobileSidebar();
    });

    if (animate) {
      item.addEventListener('animationend', () => {
        item.classList.remove('newly-added');
      }, { once: true });
    }

    return item;
  }

  function renderSidebarFull() {
    notesListEl.innerHTML = '';
    notes.forEach(note => {
      notesListEl.appendChild(createNoteElement(note, false));
    });
  }

  function switchActiveNote(newId) {
    activeNoteId = newId;

    notesListEl.querySelectorAll('.note-item').forEach(el => {
      if (el.dataset.id === activeNoteId) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    });

    loadActiveNote();
    saveToStorage();
  }

  function createNewNote(animate = true) {
    const newNote = {
      id: Date.now().toString(),
      title: '',
      content: '',
      updatedAt: Date.now()
    };

    notes.push(newNote);
    activeNoteId = newNote.id;

    const newEl = createNoteElement(newNote, animate);
    notesListEl.appendChild(newEl);

    switchActiveNote(newNote.id);
    noteTitleEl.focus();

    if (animate) {
      newEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
  }

  function loadActiveNote() {
    const note = notes.find(n => n.id === activeNoteId);
    if (note) {
      noteTitleEl.value = note.title;
      noteContentEl.value = note.content;
    }
  }

  function saveActiveNote() {
    const note = notes.find(n => n.id === activeNoteId);
    if (note) {
      note.title = noteTitleEl.value;
      note.content = noteContentEl.value;
      note.updatedAt = Date.now();

      saveToStorage();

      const activeTitle = notesListEl.querySelector(`.note-item[data-id="${activeNoteId}"] .note-item-title`);
      if (activeTitle) {
        activeTitle.textContent = note.title.trim() || 'Untitled Note';
      }

      saveStatusEl.textContent = 'Saved';
      saveStatusEl.style.opacity = '1';
    }
  }

  function triggerAutoSave() {
    if (isRemoteUpdate) return;
    saveStatusEl.textContent = 'Saving...';
    saveStatusEl.style.opacity = '1';
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveActiveNote, 400);
  }

  function saveToStorage() {
    localStorage.setItem('notepad_notes', JSON.stringify(notes));
    localStorage.setItem('notepad_active_id', activeNoteId);
    localStorage.setItem('notepad_bg_enabled', bgEnabled);
    localStorage.setItem('notepad_bg_url', bgUrl);
    localStorage.setItem('notepad_bg_blur', bgBlur);
    localStorage.setItem('notepad_bg_brightness', bgBrightness);

    if (db) {
      try {
        set(ref(db, 'notepad_data'), {
          notes,
          activeNoteId,
          bgEnabled,
          bgUrl,
          bgBlur,
          bgBrightness
        }).catch(err => {
          console.warn("Firebase save error (saved locally instead):", err);
        });
      } catch (err) {
        console.warn("Firebase write exception:", err);
      }
    }
  }

  function deleteNoteWithAnimation(element, id) {
    element.classList.add('deleting');
    setTimeout(() => {
      element.remove();
      deleteNote(id);
    }, 250);
  }

  function deleteNote(id) {
    notes = notes.filter(n => n.id !== id);

    if (notes.length === 0) {
      createNewNote(true);
    } else {
      if (activeNoteId === id) {
        switchActiveNote(notes[notes.length - 1].id);
      }
      saveToStorage();
    }
  }

  function setupDragAndDrop() {
    let draggedItem = null;
    let touchTimer = null;

    notesListEl.addEventListener('mousedown', (e) => {
      const handle = e.target.closest('.drag-handle');
      if (handle) {
        const item = handle.closest('.note-item');
        if (item) {
          item.setAttribute('draggable', 'true');
        }
      }
    });

    notesListEl.addEventListener('dragstart', (e) => {
      const item = e.target.closest('.note-item');
      if (item && item.getAttribute('draggable') === 'true') {
        draggedItem = item;
        item.classList.add('dragging');
      } else {
        e.preventDefault();
      }
    });

    notesListEl.addEventListener('dragend', (e) => {
      const item = e.target.closest('.note-item');
      if (item) {
        item.removeAttribute('draggable');
        item.classList.remove('dragging');
        draggedItem = null;
        syncNotesOrderFromDOM();
      }
    });

    notesListEl.addEventListener('dragover', (e) => {
      e.preventDefault();
      const afterElement = getDragAfterElement(notesListEl, e.clientY);
      if (draggedItem) {
        if (afterElement == null) {
          notesListEl.appendChild(draggedItem);
        } else {
          notesListEl.insertBefore(draggedItem, afterElement);
        }
      }
    });

    notesListEl.addEventListener('touchstart', (e) => {
      const handle = e.target.closest('.drag-handle');
      if (!handle) return;

      const item = handle.closest('.note-item');
      if (!item) return;

      touchTimer = setTimeout(() => {
        draggedItem = item;
        item.classList.add('dragging');
        if (navigator.vibrate) navigator.vibrate(40);
      }, 300);
    }, { passive: true });

    notesListEl.addEventListener('touchmove', (e) => {
      if (!draggedItem) {
        clearTimeout(touchTimer);
        return;
      }

      e.preventDefault();
      const touchY = e.touches[0].clientY;
      const afterElement = getDragAfterElement(notesListEl, touchY);

      if (afterElement == null) {
        notesListEl.appendChild(draggedItem);
      } else {
        notesListEl.insertBefore(draggedItem, afterElement);
      }
    }, { passive: false });

    const endTouch = () => {
      clearTimeout(touchTimer);
      if (draggedItem) {
        draggedItem.classList.remove('dragging');
        draggedItem = null;
        syncNotesOrderFromDOM();
      }
    };

    notesListEl.addEventListener('touchend', endTouch);
    notesListEl.addEventListener('touchcancel', endTouch);
  }

  function getDragAfterElement(container, y) {
    const draggableElements = [...container.querySelectorAll('.note-item:not(.dragging):not(.deleting)')];

    return draggableElements.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      } else {
        return closest;
      }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  function syncNotesOrderFromDOM() {
    const domItems = [...notesListEl.querySelectorAll('.note-item')];
    const reorderedNotes = [];

    domItems.forEach(item => {
      const id = item.dataset.id;
      const noteObj = notes.find(n => n.id === id);
      if (noteObj) reorderedNotes.push(noteObj);
    });

    notes = reorderedNotes;
    saveToStorage();
  }

  newNoteBtn.addEventListener('click', () => createNewNote(true));
  noteTitleEl.addEventListener('input', triggerAutoSave);
  noteContentEl.addEventListener('input', triggerAutoSave);

  // Initialize application check
  checkAuth();
</script>
</body>
</html>
