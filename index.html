<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Notepad</title>
  <link rel="icon" type="image/png" href="favicon.png">
  
  <style>
    :root {
      --bg-dark: #131314;
      --sidebar-bg: #1e1f20;
      --sidebar-hover: #282a2c;
      --sidebar-active: #37393b;
      --text-main: #e3e3e3;
      --text-muted: #8e918f;
      --accent: #a8c7fa;
      --border-color: #2c2e30;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      overflow: hidden;
      position: relative;
    }

    /* Floating/Hanging Sidebar Styling */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      user-select: none;
      z-index: 100;
      box-shadow: 6px 0 24px rgba(0, 0, 0, 0.4);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      transition: transform 0.3s ease;
    }

    /* Backdrop overlay for mobile sidebar */
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    .new-note-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #2b2c2e;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 12px 18px;
      border-radius: 28px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      margin-bottom: 20px;
    }

    .new-note-btn:hover {
      background-color: var(--sidebar-hover);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .new-note-btn:active {
      transform: scale(0.98);
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }

    /* Note Item Animations */
    .note-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: grab;
      color: var(--text-muted);
      font-size: 14px;
      transition: background 0.2s ease, color 0.15s ease, transform 0.25s ease, opacity 0.25s ease, max-height 0.25s ease, margin 0.25s ease, padding 0.25s ease;
      max-height: 48px;
      opacity: 1;
      overflow: hidden;
    }

    .note-item.newly-added {
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .note-item.deleting {
      opacity: 0;
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-top: 0;
      margin-bottom: 0;
      transform: scale(0.9);
      pointer-events: none;
    }

    .note-item:active {
      cursor: grabbing;
    }

    .note-item.dragging {
      opacity: 0.3;
      background-color: var(--sidebar-hover);
    }

    .note-item:hover {
      background-color: var(--sidebar-hover);
      color: var(--text-main);
    }

    .note-item.active {
      background-color: var(--sidebar-active);
      color: var(--text-main);
      font-weight: 500;
    }

    .note-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      pointer-events: none;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 50%;
      opacity: 0.6;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .note-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      color: #ff6b6b;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.95);
        max-height: 0;
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        max-height: 48px;
      }
    }

    /* Main Editor Area */
    .main-content {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 28px 48px;
      background-color: var(--bg-dark);
      overflow: hidden;
    }

    /* Mobile Sidebar Toggle Button */
    .menu-toggle-btn {
      display: none;
      background: rgba(30, 31, 32, 0.85);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      z-index: 10;
      margin-right: 12px;
      backdrop-filter: blur(8px);
    }

    /* Wallpaper Layers */
    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.4s ease, filter 0.1s linear;
      background-position: center;
      background-size: cover;
    }

    .main-content.bg-active .bg-overlay {
      opacity: 1;
    }

    /* Dark Overlay for readability */
    .bg-dimmer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(19, 19, 20, 0.4);
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .main-content.bg-active .bg-dimmer {
      opacity: 1;
    }

    .editor-header, .editor-textarea {
      position: relative;
      z-index: 3;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .editor-header-left {
      display: flex;
      align-items: center;
      flex: 1;
    }

    .title-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 24px;
      font-weight: 600;
      width: 100%;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .save-status {
      font-size: 12px;
      color: var(--text-muted);
      transition: opacity 0.3s ease;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      white-space: nowrap;
      margin-left: 12px;
    }

    .editor-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 16px;
      line-height: 1.6;
      resize: none;
      font-family: inherit;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    /* Bottom Right Control Bar */
    .controls-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(30, 31, 32, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 12px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #37393b;
      transition: 0.3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: var(--text-muted);
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
      background-color: #131314;
    }

    /* Gear Button */
    .gear-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 50%;
      transition: color 0.2s, transform 0.3s;
    }

    .gear-btn:hover {
      color: var(--text-main);
      transform: rotate(45deg);
    }

    /* Config Popover */
    .popover {
      position: absolute;
      bottom: 60px;
      right: 20px;
      z-index: 20;
      background: #1e1f20;
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 300px;
      max-width: calc(100vw - 40px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.95);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .popover.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .popover-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .popover label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .slider-val {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
    }

    .popover input[type="text"] {
      background: #131314;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .popover input[type="text"]:focus {
      border-color: var(--accent);
    }

    .popover input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #2b2c2e;
      border-radius: 3px;
      outline: none;
    }

    .popover input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .popover input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }

    .popover-btn {
      background: var(--accent);
      color: #131314;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 4px;
    }

    .popover-btn:hover {
      opacity: 0.9;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #37393b;
      border-radius: 3px;
    }

    /* --- Responsive Mobile Styles --- */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .menu-toggle-btn {
        display: block;
      }

      .main-content {
        padding: 16px 20px;
      }

      .title-input {
        font-size: 20px;
      }

      .controls-container {
        bottom: 16px;
        right: 16px;
        padding: 8px 14px;
      }

      .delete-btn {
        opacity: 1; /* Keep visible on touch devices */
      }
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <button class="new-note-btn" id="newNoteBtn">
      <span>+</span> New note
    </button>
    <div class="notes-list" id="notesList"></div>
  </aside>

  <main class="main-content" id="mainContent">
    <video class="bg-overlay" id="bgVideo" autoplay loop muted playsinline style="display: none;"></video>
    <div class="bg-overlay" id="bgImage" style="display: none;"></div>
    <div class="bg-dimmer"></div>

    <div class="editor-header">
      <div class="editor-header-left">
        <button class="menu-toggle-btn" id="menuToggleBtn">☰</button>
        <input type="text" id="noteTitle" class="title-input" placeholder="Untitled Note">
      </div>
      <span id="saveStatus" class="save-status">Saved</span>
    </div>
    <textarea id="noteContent" class="editor-textarea" placeholder="Start typing..."></textarea>

    <div class="controls-container">
      <label class="switch">
        <input type="checkbox" id="bgToggle">
        <span class="slider"></span>
      </label>
      <button class="gear-btn" id="gearBtn" title="Change Background Settings">⚙</button>
    </div>

    <div class="popover" id="popover">
      <div class="popover-group">
        <label for="bgUrlInput">Wallpaper Link (Image / GIF / Video)</label>
        <input type="text" id="bgUrlInput" placeholder="https://...">
      </div>

      <div class="popover-group">
        <div class="popover-header">
          <label for="blurSlider">Blur</label>
          <span class="slider-val" id="blurVal">0px</span>
        </div>
        <input type="range" id="blurSlider" min="0" max="20" value="0" step="1">
      </div>

      <div class="popover-group">
        <div class="popover-header">
          <label for="brightnessSlider">Brightness</label>
          <span class="slider-val" id="brightnessVal">100%</span>
        </div>
        <input type="range" id="brightnessSlider" min="0" max="100" value="100" step="5">
      </div>

      <button class="popover-btn" id="saveBgBtn">Apply</button>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // --- Firebase Setup ---
    // Note: Configure your Firebase project details below to enable global cross-device synchronization.
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let db = null;
    try {
      if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        const app = initializeApp(firebaseConfig);
        db = getDatabase(app);
      }
    } catch (e) {
      console.warn("Firebase not properly initialized. Falling back to local storage.", e);
    }

    const DEFAULT_BG_URL = 'https://motionbgs.com/media/4553/miku-nakano.960x540.mp4';

    // State
    let notes = JSON.parse(localStorage.getItem('notepad_notes')) || [];
    let activeNoteId = localStorage.getItem('notepad_active_id') || null;
    let bgEnabled = JSON.parse(localStorage.getItem('notepad_bg_enabled') ?? 'true');
    let bgUrl = localStorage.getItem('notepad_bg_url') || DEFAULT_BG_URL;
    let bgBlur = localStorage.getItem('notepad_bg_blur') || '0';
    let bgBrightness = localStorage.getItem('notepad_bg_brightness') || '100';
    let saveTimeout = null;
    let isRemoteUpdate = false;

    // DOM Elements
    const notesListEl = document.getElementById('notesList');
    const newNoteBtn = document.getElementById('newNoteBtn');
    const noteTitleEl = document.getElementById('noteTitle');
    const noteContentEl = document.getElementById('noteContent');
    const saveStatusEl = document.getElementById('saveStatus');
    const mainContent = document.getElementById('mainContent');
    const bgVideo = document.getElementById('bgVideo');
    const bgImage = document.getElementById('bgImage');
    const bgToggle = document.getElementById('bgToggle');
    const gearBtn = document.getElementById('gearBtn');
    const popover = document.getElementById('popover');
    const bgUrlInput = document.getElementById('bgUrlInput');
    const blurSlider = document.getElementById('blurSlider');
    const blurVal = document.getElementById('blurVal');
    const brightnessSlider = document.getElementById('brightnessSlider');
    const brightnessVal = document.getElementById('brightnessVal');
    const saveBgBtn = document.getElementById('saveBgBtn');
    
    // Mobile Controls
    const sidebar = document.getElementById('sidebar');
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    function init() {
      setupMobileEvents();
      setupDragAndDrop();
      initBackgroundControls();

      if (db) {
        setupCloudSync();
      } else {
        initLocalData();
      }
    }

    function initLocalData() {
      if (notes.length === 0) {
        createNewNote(false);
      } else {
        if (!activeNoteId || !notes.find(n => n.id === activeNoteId)) {
          activeNoteId = notes[0].id;
        }
        renderSidebarFull();
        loadActiveNote();
      }
    }

    // --- Cloud Syncing (Firebase) ---
    function
